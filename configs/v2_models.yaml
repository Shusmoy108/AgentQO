# M9 model configs. Keys are the names used by scripts/v2/model_env.py.
models:
  qwen_small: Qwen/Qwen2.5-1.5B-Instruct
  qwen_large: Qwen/Qwen2.5-7B-Instruct
  qwen3b: Qwen/Qwen2.5-3B-Instruct
  qwen14b: Qwen/Qwen2.5-14B-Instruct
  granite_small: ibm-granite/granite-3.1-2b-instruct
  granite_large: ibm-granite/granite-3.1-8b-instruct
max_tokens:
  qwen_math: 256
  granite: 512
  hotpotqa: 384
# Ollama tags for Mac dry runs. Missing entries have no local build.
ollama_tags:
  qwen_small: qwen2.5:1.5b-instruct
  qwen_large: qwen2.5:7b-instruct
  qwen3b: qwen2.5:3b
