# M1 price table. Change values here; nothing is hard-coded in cost_model.py.
api_usd_per_million:
  small: {input: 0.10, output: 0.50}
  large: {input: 2.00, output: 10.00}
# gpu_hour_usd prices the gpu_usd column; the sweep adds gpu_usd_<rate> columns.
gpu_hour_usd: 2
gpu_hour_sweep: [1, 2, 4]
# Old cost units, kept so v2 tables line up with the Session 1 numbers.
cost_units: {small: 1, large: 4}
# Shared-GPU split: vLLM --gpu-memory-utilization used in Session 1 P1
# (small 0.25, second large server 0.55 on one GPU).
shared_memory_fraction: {small: 0.25, large: 0.55}
